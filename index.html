<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rage de sucre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one 16:9 stage (640x360 logical units) drawn at full screen resolution, letterboxed on black */
:root{
  --void:#03050c;
  --bone:#e9ecf4;
  --toxic:#7dff3a;
  --blood:#ff2240;
  --font-horror:"Creepster", "Chiller", fantasy;
  --font-ui:"Barlow Condensed", "Arial Narrow", sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--bone);overflow:hidden;display:grid;place-items:center;font-family:var(--font-ui)}
canvas{display:block;cursor:pointer;outline:none;touch-action:none}
canvas:focus-visible{outline:2px solid var(--toxic)}
</style>
</head>
<body>
<canvas id="g" tabindex="0" aria-label="Jeu Rage de sucre : flèches pour changer de sentier, espace pour lancer un bonbon"></canvas>

<script>
(() => {
'use strict';
const W = 640, H = 360, NL = 4, LT = 80, LH = 63;
const PATH_X1 = 560, PX = 572;
const laneTop = i => LT + i * LH;
const feetY = i => LT + i * LH + 46;

const cv = document.getElementById('g');
const MAIN = cv.getContext('2d');
let ctx = MAIN;      // helpers draw into whichever context is current
let K = 1;           // device pixels per logical unit

/* ---------- Colors & fonts ---------- */
const C = {
  void:'#03050c', ink:'#060a1a', night:'#0a1430', navy:'#13285e', steel:'#2d3a72',
  toxic:'#7dff3a', blood:'#ff2240', acid:'#2ef2ff', hot:'#ff2fb3', bile:'#e8ff3a', orange:'#ff8a1f',
  bone:'#e9ecf4', dim:'#7d8ab8', mute:'#3d4a7a'
};
const OUT = '#02030a';
const FONT = {ui: '"Barlow Condensed", "Arial Narrow", sans-serif', horror: '"Creepster", "Chiller", fantasy'};

/* ---------- Drawing primitives (logical units) ---------- */
const TAU = Math.PI * 2;
function sh(fill, lw = 1.1) { ctx.fillStyle = fill; ctx.fill(); ctx.lineWidth = lw; ctx.strokeStyle = OUT; ctx.stroke(); }
function ell(x, y, rx, ry, fill, rot = 0, stroke = true) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU);
  if (stroke) sh(fill); else { ctx.fillStyle = fill; ctx.fill(); }
}
function poly(pts, fill, stroke = true) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  if (stroke) sh(fill); else { ctx.fillStyle = fill; ctx.fill(); }
}
function limb(x1, y1, x2, y2, w, col, outline = true) {
  ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  if (outline) { ctx.strokeStyle = OUT; ctx.lineWidth = w + 2; ctx.stroke(); }
  ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
}
function line(x1, y1, x2, y2, col, w = 1) { ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke(); }
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function glowEye(x, y, r, col, blur = 6) {
  ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = blur * K;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = col; ctx.fill();
  ctx.restore();
}
function lg(x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g; }
function rg(x, y, r0, r1, stops) { const g = ctx.createRadialGradient(x, y, r0, x, y, r1); stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g; }
function legs(p, col, hip = 11, spread = 3.5, w = 3.4, foot = OUT) {
  const s = Math.sin(p), a = s * 4, l1 = Math.max(0, s) * 2, l2 = Math.max(0, -s) * 2;
  limb(-spread, -hip, -spread - a, -l2, w, col); ell(-spread - a + 1.4, -l2 - .6, 2.6, 1.4, foot);
  limb(spread, -hip, spread + a, -l1, w, col); ell(spread + a + 1.4, -l1 - .6, 2.6, 1.4, foot);
}
function heartPath(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * .35);
  ctx.bezierCurveTo(x, y, x - s * .5, y, x - s * .5, y + s * .35);
  ctx.bezierCurveTo(x - s * .5, y + s * .65, x, y + s * .8, x, y + s);
  ctx.bezierCurveTo(x, y + s * .8, x + s * .5, y + s * .65, x + s * .5, y + s * .35);
  ctx.bezierCurveTo(x + s * .5, y, x, y, x, y + s * .35);
}
function heart(x, y, col, s = 7) { heartPath(x, y, s); ctx.fillStyle = col; ctx.fill(); }
function cross(x, y, col = C.blood, s = 7) { line(x, y, x + s, y + s, col, 2); line(x + s, y, x, y + s, col, 2); }
function txt(s, x, y, col = C.bone, al = 'left', size = 11, font = 'ui', shadow = OUT, weight = 700) {
  ctx.font = (font === 'ui' ? weight + ' ' : '') + size + 'px ' + FONT[font];
  ctx.textAlign = al; ctx.textBaseline = 'top';
  if (shadow) { ctx.fillStyle = shadow; ctx.fillText(s, x + size * .08, y + size * .08); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function textW(s, size, font = 'ui') { ctx.font = (font === 'ui' ? '700 ' : '') + size + 'px ' + FONT[font]; return ctx.measureText(s).width; }
function wrap(s, n) {
  const out = []; let l = '';
  s.split(' ').forEach(w => { if ((l + ' ' + w).trim().length > n) { out.push(l.trim()); l = w; } else l += ' ' + w; });
  if (l.trim()) out.push(l.trim());
  return out;
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- Candies (vector) ---------- */
const CANDIES = [
  {id:'choco', name:'Tablette de chocolat', col:'#d0884a'},
  {id:'lolly', name:'Sucette citrouille', col:'#ff8a1f'},
  {id:'peach', name:'Anneau de pêche', col:'#ffa060'},
  {id:'worm', name:'Ver gélifié', col:'#7dff3a'},
  {id:'bear', name:'Ourson gélifié', col:'#2ef2ff'},
  {id:'licorice', name:'Réglisse rouge', col:'#ff5a3a'},
  {id:'floss', name:'Barbe à papa', col:'#ff2fb3'},
  {id:'eye', name:'Œil gélifié', col:'#e9ecf4'},
];
const CI = Object.fromEntries(CANDIES.map((c, i) => [c.id, i]));
function drawCandy(i, x, y, s = 1, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  switch (CANDIES[i].id) {
    case 'choco':
      ctx.save(); ctx.rotate(-.25);
      rrect(-7.5, -4.8, 15, 9.6, 1.2); sh('#4a2210');
      for (let c = 0; c < 4; c++) for (let r = 0; r < 2; r++) {
        const sx = -6.7 + c * 3.5, sy = -4 + r * 4.2;
        rrect(sx, sy, 3, 3.6, .5); ctx.fillStyle = lg(sx, sy, sx + 3, sy + 3.6, ['#b06a36', '#7a4020', '#5a2e14']); ctx.fill();
        line(sx + .5, sy + .5, sx + 2.5, sy + .5, 'rgba(255,220,170,.55)', .5);
      }
      // peeled wrapper: torn silver foil, then red paper with a gold band
      poly([.6, -5.4, 1.8, -4, 1, -2.6, 2.2, -1.2, 1.2, .2, 2.2, 1.6, 1.1, 3, 2, 4.4, 1.2, 5.4, 8, 5.4, 8, -5.4], '#d8deec');
      poly([2.6, -5.6, 8.2, -5.6, 8.2, 5.6, 2.6, 5.6], lg(0, -6, 0, 6, ['#ff5a6a', C.blood, '#8a0018']));
      rrect(2.6, -1.2, 5.6, 2.4, .2); ctx.fillStyle = '#e8c050'; ctx.fill();
      ctx.restore();
      break;
    case 'lolly':
      limb(0, 3, 0, 10, 1.3, '#f4f0e8');
      ell(0, -1, 5.6, 5.6, rg(-1.5, -2.5, 1, 6, ['#ffc060', '#ff8a1f', '#c04a00']));
      ctx.beginPath();
      for (let a = 0; a < 12; a += .3) { const r = a * .42; ctx.lineTo(Math.cos(a) * r, -1 + Math.sin(a) * r); }
      ctx.strokeStyle = C.bile; ctx.lineWidth = 1.1; ctx.stroke();
      break;
    case 'peach': {
      // a peach ring seen at an angle: yellow bottom layer under a peach-orange top, sugar-coated
      const ring = dy => { ctx.beginPath(); ctx.ellipse(0, dy, 6.8, 4.4, 0, 0, TAU); ctx.moveTo(2.6, dy - .3); ctx.ellipse(0, dy - .3, 2.6, 1.5, 0, 0, TAU, true); };
      ring(1.9); ctx.fillStyle = lg(0, -3, 0, 6, ['#fff2a0', '#ffd23a', '#d89a10']); ctx.fill('evenodd');
      ctx.lineWidth = .9; ctx.strokeStyle = OUT; ctx.stroke();
      ring(-.6); ctx.fillStyle = rg(-2.5, -2.6, .5, 8, ['#ffd0a0', '#ff8a4a', '#e0503a']); ctx.fill('evenodd'); ctx.stroke();
      // inner wall of the hole, showing both layers
      ctx.save(); ctx.beginPath(); ctx.ellipse(0, -.9, 2.6, 1.5, 0, 0, TAU); ctx.clip();
      ctx.fillStyle = '#c85030'; ctx.fillRect(-3, -2.6, 6, 1.3); ctx.fillStyle = '#e8b020'; ctx.fillRect(-3, -1.3, 6, 1);
      ctx.restore();
      ctx.beginPath(); ctx.ellipse(-2.8, -2.6, 2.2, .8, -.3, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fill();
      [[-4.6, -.6], [-3, 1.8], [-.6, 2.6], [2.2, 2.4], [4.4, .8], [4.6, -1.8], [2, -3.4], [-1, -3.6], [-5, 3.4], [.6, 4.8], [4.2, 3.8]].forEach(([a, b]) => ell(a, b, .3, .3, '#fffaf0', 0, false));
      break;
    }
    case 'worm':
      ctx.beginPath(); ctx.moveTo(-6.5, 2.5); ctx.bezierCurveTo(-3, -5, 0, 6, 3, -1); ctx.quadraticCurveTo(5, -4, 6.5, -2);
      ctx.lineCap = 'round'; ctx.strokeStyle = OUT; ctx.lineWidth = 5.4; ctx.stroke();
      ctx.strokeStyle = C.toxic; ctx.lineWidth = 3.6; ctx.stroke();
      ctx.setLineDash([2.2, 2.2]); ctx.strokeStyle = C.hot; ctx.stroke(); ctx.setLineDash([]);
      break;
    case 'bear': {
      // translucent blue-raspberry gummy bear: outline every part first so they merge into one silhouette
      const parts = [[-2.7, 5.4, 2.2, 1.8, 0], [2.7, 5.4, 2.2, 1.8, 0], [-4.1, .2, 1.5, 2.3, .6], [4.1, .2, 1.5, 2.3, -.6], [0, 1.8, 4, 4.4, 0], [-2.8, -7.2, 1.4, 1.4, 0], [2.8, -7.2, 1.4, 1.4, 0], [0, -4.6, 3.8, 3.3, 0]];
      parts.forEach(([a, b, rx, ry, r]) => { ctx.beginPath(); ctx.ellipse(a, b, rx, ry, r, 0, TAU); ctx.strokeStyle = OUT; ctx.lineWidth = 2.2; ctx.stroke(); });
      const jelly = rg(-1.5, -2, .5, 10, ['#d8fbff', '#2ec8f2', '#1a5ab0']);
      parts.forEach(([a, b, rx, ry, r]) => ell(a, b, rx, ry, jelly, r, false));
      ell(0, -3.6, 1.7, 1.2, 'rgba(216,251,255,.6)', 0, false);
      ell(-1.3, -5.2, .45, .55, '#0a2a5a', 0, false); ell(1.3, -5.2, .45, .55, '#0a2a5a', 0, false);
      ell(0, -3.9, .55, .4, '#0a2a5a', 0, false);
      ell(-1.8, .4, .9, 2, 'rgba(255,255,255,.55)', .3, false);
      break;
    }
    case 'licorice':
      // a twisted stick of red licorice
      ctx.save(); ctx.rotate(-.7);
      rrect(-8.5, -2.4, 17, 4.8, 2); sh(lg(0, -2.4, 0, 2.4, ['#ff6a50', '#e01a1a', '#7a0808']));
      ctx.save(); rrect(-8.5, -2.4, 17, 4.8, 2); ctx.clip();
      for (let k = -9; k < 10; k += 2.4) { line(k, 2.6, k + 2.4, -2.6, '#8a0a0a', .9); line(k + .7, 2.6, k + 3.1, -2.6, 'rgba(255,170,150,.55)', .5); }
      ctx.restore();
      ell(8.1, 0, 1.2, 2.2, '#c01010');
      ell(8.1, 0, .45, .9, '#4a0404', 0, false);
      ctx.restore();
      break;
    case 'floss':
      limb(0, 2, 0, 10, 1.3, '#d8b080');
      [[-3, -1, 3.6], [3, -1.5, 3.8], [0, -4.5, 4], [0, 0, 3.8]].forEach(([a, b, r]) => ell(a, b, r, r, rg(a - 1, b - 1, .5, r, ['#ffc4ec', '#ff6ad0', '#d02a9a']), 0, false));
      ctx.beginPath(); ctx.ellipse(0, -1.8, 7, 6, 0, 0, TAU); ctx.strokeStyle = OUT; ctx.lineWidth = .9; ctx.stroke();
      break;
    case 'eye':
      ell(0, 0, 6, 6, rg(-2, -2, .5, 6.5, ['#ffffff', '#f2eef0', '#c8b8c0']));
      [[-5, 2, -2.5, .5], [-4.5, -3, -2, -1.2], [4.5, 3.5, 2.5, 1.5]].forEach(([a, b, c, d]) => line(a, b, c, d, '#e0304a', .6));
      ell(1.5, 0, 2.7, 2.7, rg(1.5, 0, .5, 2.7, ['#d0ff80', '#4ad01a']), 0, false);
      ell(1.8, 0, 1.2, 1.2, OUT, 0, false);
      ell(.8, -1, .6, .6, '#ffffff', 0, false);
      break;
  }
  ctx.restore();
}

/* ---------- Creatures (vector, facing right, feet at y=0) ---------- */
function drawZombie(p, o) {
  const sw = Math.sin(T * 2 + o.seed);
  legs(p, '#2c3566', 11, 3.5, 3.6, '#4f8a2e');
  limb(2, -25, 17, -23 + sw, 3.4, '#4f8a2e'); ell(18.5, -23 + sw, 2.2, 1.8, '#6fb042');
  poly([-8, -11, -6, -8.5, -3.5, -11.5, -.5, -8.5, 2.5, -11.5, 5.5, -8.5, 8, -11, 9, -27, 4, -29, -4, -29, -9, -27], lg(0, -29, 0, -9, ['#8a2a40', '#4a1020']));
  poly([-3, -20, 0, -23.5, 1.5, -18], '#6fb042', false); poly([4, -15, 6.5, -18, 7, -13.5], '#6fb042', false);
  line(-5, -24, -1, -25, '#3a0a18', .8);
  limb(3, -23, 19.5, -19 - sw, 3.6, '#7fc94e'); ell(21, -19 - sw, 2.3, 1.9, '#8fd65a');
  line(20.5, -20 - sw, 23, -21.5 - sw, '#8fd65a', 1); line(21, -18.5 - sw, 23.5, -18.5 - sw, '#8fd65a', 1);
  ctx.save(); ctx.translate(1, -34.5); ctx.rotate(.14);
  ell(0, 0, 7, 7.6, lg(0, -8, 0, 8, ['#b4f57a', '#5f9a3a', '#3a6a22']));
  poly([-6.5, -3.5, -4.5, -8, -2.5, -5, 0, -8.6, 2, -5.2, 4, -7.6, 5.6, -4], '#141c10');
  ell(3.3, -.3, 2.5, 2.7, '#f6ffe0'); glowEye(3.9, -.1, .95, C.blood, 4);
  ell(-1.8, .2, 1.5, 1.1, '#16220e', 0, false);
  poly([-2.5, 3.6, 5.2, 3.1, 4.6, 5.6, -1.8, 5.8], '#24060c');
  for (let k = 0; k < 3; k++) ctx.fillStyle = '#f2ecd0', ctx.fillRect(-1.2 + k * 2, 3.5, 1.1, 1.1);
  line(-5, -2.5, 0, -4.5, '#2a3a1a', .6);
  for (let k = 0; k < 3; k++) line(-4.2 + k * 1.8, -4.4 + k * .7, -3.6 + k * 1.8, -2.1 + k * .7, '#2a3a1a', .5);
  ctx.restore();
}
function drawMummy(p, o) {
  const sw = Math.sin(p) * 1.2, flut = Math.sin(T * 3 + o.seed);
  legs(p, '#d8cca8', 10, 3.4, 3.8, '#a89a74');
  // loose bandage streaming behind the head, so it reads as moving forward
  ctx.beginPath(); ctx.moveTo(-4, -39); ctx.bezierCurveTo(-10, -40 + flut, -13, -35 - flut, -18 - flut * .8, -33 + flut * 1.4);
  ctx.lineCap = 'round'; ctx.strokeStyle = OUT; ctx.lineWidth = 2.8; ctx.stroke(); ctx.strokeStyle = '#ece2c2'; ctx.lineWidth = 1.5; ctx.stroke();
  // classic mummy pose: both arms stretched out in front
  limb(-3, -27, 13, -25 + sw, 3.4, '#bfb28a'); ell(13.8, -25 + sw, 1.9, 1.7, '#bfb28a');
  rrect(-8, -29.5, 16, 20, 5); sh(lg(0, -30, 0, -9, ['#f2e8c8', '#b9ac86']));
  ctx.save(); rrect(-8, -29.5, 16, 20, 5); ctx.clip();
  for (let k = 0; k < 7; k++) line(-9, -28 + k * 3.2, 9, -30 + k * 3.2 + 2.5, '#9c8f6a', .7);
  ell(-3, -18, 2.2, 1.4, 'rgba(40,24,10,.55)', .4, false);
  ctx.restore();
  limb(4, -25, 17, -22 - sw, 3.6, '#e2d6b2'); ell(17.8, -22 - sw, 2, 1.8, '#e2d6b2');
  for (let k = 0; k < 3; k++) line(7 + k * 3.4, -25.6 - sw * k * .3, 8.4 + k * 3.4, -22.4 - sw * k * .3, '#9c8f6a', .6);
  ell(1, -36, 7, 7.4, lg(0, -43, 0, -29, ['#f6ecd0', '#b3a682']));
  ctx.save(); ctx.beginPath(); ctx.ellipse(1, -36, 7, 7.4, 0, 0, TAU); ctx.clip();
  for (let k = 0; k < 6; k++) line(-7, -41 + k * 2.6, 9, -42.5 + k * 2.6 + 1.6, '#9c8f6a', .6);
  poly([-.5, -37.8, 8, -38.6, 8, -34.6, -.5, -34.2], '#120c08', false);
  ctx.restore();
  glowEye(5, -36.4, 1.3, C.acid, 7); ell(1.4, -36, .9, .7, '#2a2016', 0, false);
}
function drawVampire(p, o) {
  const sw = Math.sin(T * 2 + o.seed), flap = Math.sin(T * 3 + o.seed) * 1.5;
  legs(p, '#10121e', 12, 3.2, 3.4, '#05060c');
  poly([-6, -34, -14 - flap, -10, -12 - flap, -1, -5, -5, 1, -2.5, 8, -7, 9, -31], lg(-12, 0, 8, 0, ['#05060e', '#141a3a']));
  poly([6.5, -30, 10, -7.5, 7.5, -9, 4.5, -28], '#c3102e', false);
  poly([-5, -31, 5, -31, 6, -12, -6, -12], '#151830');
  poly([-2.2, -31, 2.2, -31, 0, -23], '#eef0ff', false); glowEye(0, -27, 1, C.blood, 4);
  poly([-7, -31, -11.5, -45, -3, -36], '#0d1024'); poly([7, -31, 10.5, -45, 3, -36], '#0d1024');
  line(-7.5, -33, -10, -42, '#a00c26', 1); line(7.5, -33, 9.5, -42, '#a00c26', 1);
  ell(1, -37.5, 6, 7, lg(0, -44, 0, -30, ['#f4f0ff', '#b8b0d0']));
  poly([-5.2, -39, -5.6, -44, 0, -46.5, 6, -44.5, 7, -39, 3.4, -41.2, 1, -37.4, -1.2, -41.2], '#0a0a16');
  glowEye(3.6, -37.8, 1.15, C.blood, 7); glowEye(-.4, -37.8, 1, C.blood, 7);
  line(-.5, -33.4, 4.5, -33.6, '#40102a', .8);
  poly([.8, -33.5, 1.6, -31.4, 2.4, -33.5], '#ffffff', false); poly([3, -33.5, 3.8, -31.5, 4.6, -33.6], '#ffffff', false);
  limb(5, -29, 7.5, -20, 2.8, '#151830'); limb(7.5, -20, 6 + sw * .4, -14.5, 2.6, '#151830');
  poly([5, -31, 9.5, -22, 10.5 + flap * .5, -11, 7, -12.5, 6.5, -20], '#0b0f24');
  line(9.4, -21.5, 10.2 + flap * .5, -11.5, 'rgba(195,16,46,.9)', .9);
  ell(6 + sw * .4, -13.6, 1.6, 1.4, '#d8d2ea');
  for (let k = -1; k <= 1; k++) line(6 + sw * .4 + k * .9, -12.8, 6.4 + sw * .4 + k * 1.3, -10.6, '#d8d2ea', .7);
}
function drawGhost(p, o) {
  const red = o.red, c1 = red ? '#ffb0c0' : '#f2fdff', c2 = red ? '#c0103a' : '#40c8ff';
  ctx.save(); ctx.translate(0, -5 + Math.sin(T * 3 + o.seed) * 2);
  ctx.beginPath(); ctx.moveTo(-11, -28); ctx.arc(0, -28, 11, Math.PI, 0); ctx.lineTo(11, -5);
  for (let i = 11, k = 0; i > -11; i -= 5.5, k++) ctx.quadraticCurveTo(i - 2.75, -5 + (k % 2 ? -2 : 5) + Math.sin(T * 6 + i) * 1.5, i - 5.5, -5);

  {name:'Le château maudit', boss:2, all:true},

const NW = WORLDS.length;
function stageOf(n) { const w = Math.floor((n - 1) / 3); return {num: w + 1, wi: w % NW, cycle: Math.floor(w / NW), stage: (n - 1) % 3 + 1}; }
const fmtLevel = n => { const s = stageOf(n); return s.num + '-' + s.stage; };
function worldLists(n) {
  const s = stageOf(n), wd = WORLDS[s.wi];
  if (wd.all) return {sp: SPECIES.map((_, i) => i), c: CANDIES.map((_, i) => i), newSp: [], newC: []};
  const upto = s.cycle ? 3 : s.stage;
  return {
    sp: wd.sp.slice(0, upto).flat().map(spI), c: wd.c.slice(0, upto).flat().map(id => CI[id]),
    newSp: s.cycle ? [] : wd.sp[s.stage - 1].map(spI), newC: s.cycle ? [] : wd.c[s.stage - 1].map(id => CI[id]),
  };
}

        const runs = v.runs.filter(r => r && typeof r.score === 'number').map(cleanRun);

    boss, total: boss ? Math.max(4, Math.round(total * .6)) : total,
    interval: Math.max(.8, 3.4 - .28 * (n - 1)),

}

// extra = a minion summoned during the boss fight (not counted in the level's total)
function spawn(extra = false) {

  const free = [];
  for (let i = 0; i < NL; i++) if (!G.mons.some(m => m.lane === i && m.state !== 'leave' && m.x < 44)) free.push(i);
  if (!free.length) { G.spawnT = .3; return; }
  const sp = pickSpecies(), lane = free[(Math.random() * free.length) | 0];
  G.mons.push({sp, lane, x: 20 - sp.w / 2, w: sp.w, h: sp.h, speed: G.cfg.speed * (.85 + Math.random() * .3),
               mult: 1, anger: 0, state: 'walk', t: 0, dur: 1, ph: Math.random() * 6, seed: Math.random() * 6, rise: .7, extra});

function spawnBoss() {

function reaction(m, cid) {
  const sp = m.sp, cand = CANDIES[cid].id;

}
const monTop = m => (m.fy ?? feetY(m.lane)) - m.h;
function hit(m, cid) {
  const r = reaction(m, cid), sp = m.sp;
  (G.known[sp.id] ||= {})[CANDIES[cid].id] = r;

    G.score += pts;
    addText('MIAM! +' + pts, cx, top - 14, C.toxic);
    burst(8, cx, top + 14, CANDIES[cid].col, {spread: 70, g: 160, life: .6});
    for (let i = 0; i < 4; i++) G.parts.push({x: cx + (Math.random() - .5) * 16, y: top, vx: (Math.random() - .5) * 20, vy: -30 - Math.random() * 20, g: 0, life: 1, max: 1, col: C.hot, kind: 'heart'});
    sfx.munch();
  } else if (r === 'hate') {
    m.state = 'react'; m.dur = m.t = 1.2;
    addText(sp.cry, cx, top - 14, sp.col, 1.3);
    sfx.hate(sp.pitch);
    const fy = feetY(m.lane);
    switch (sp.id) {
      case 'zombie': G.parts.push({x: m.x + m.w, y: top + 18, vx: 50, vy: -110, g: 320, life: 1, max: 1, col: '#7fc94e', w: 9, h: 3.4, kind: 'bar', rot: 0});
        burst(8, cx, top + 10, '#3a8a1a', {spread: 70, g: 200}); break;
      case 'mummy': burst(8, cx, top + 12, '#efe2c0', {spread: 140, g: 60, w: 6, h: 1.4, life: 1, kind: 'bar'}); break;
      case 'vampire': burst(12, cx, top + 12, '#3a1048', {spread: 60, g: -20, w: 3, h: 3, life: .7}); break;
      case 'ghost': burst(12, cx, top + 12, C.blood, {spread: 120, g: 0, life: .6}); break;
      case 'wolf': burst(10, cx, top + 14, '#8a5a38', {spread: 90, g: 150, w: 2.4, h: 1, kind: 'bar'}); break;
      case 'skeleton': burst(12, cx, top + 10, C.bone, {vy: -90, spread: 120, g: 260, w: 5, h: 1.6, life: .85, kind: 'bone'}); break;
      case 'troll': G.shake = .4; burst(12, cx, fy, '#3d4a80', {vy: -20, spread: 110, g: 60, w: 3, h: 3}); break;
      case 'goblin': burst(8, cx, top + 10, C.bile, {vy: -100, spread: 90, g: 260, w: 2.4, h: 2.4}); break;
    }

// a boss shows that it liked a candy but keeps coming until it has eaten enough of them
function bossHit(m, r, cx, top) {
  const sp = m.sp;
  if (r === 'like') {
    G.bossFed++; m.chew = .6;
    const pts = 100 + 20 * G.level; G.score += pts;
    for (let i = 0; i < 6; i++) G.parts.push({x: cx + (Math.random() - .5) * 24, y: top + 6, vx: (Math.random() - .5) * 30, vy: -30 - Math.random() * 25, g: 0, life: 1.1, max: 1.1, col: C.hot, kind: 'heart'});
    sfx.munch();
    if (G.bossFed >= m.need) { bossDefeated(m, cx, top); return; }
    addText('MIAM! ' + G.bossFed + '/' + m.need, cx, top - 14, C.toxic, 1.3);
  } else if (r === 'hate') {
    m.state = 'react'; m.dur = m.t = .9; G.shake = .7;
    addText(sp.cry, cx, top - 14, sp.col, 1.4);
    sfx.hate(sp.pitch); sfx.roar();
    burst(18, cx, top + 24, C.blood, {spread: 130, g: 80, life: .7});
  } else {
    m.state = 'meh'; m.dur = m.t = .5;
    addText('BOF...', cx, top - 14, C.dim, 1);
    sfx.meh();
  }
}
function bossDefeated(m, cx, top) {

  addText('RASSASIÉ! +' + bonus, Math.max(cx, 120), top - 16, C.bile, 2.4);
  for (let i = 0; i < 16; i++) G.parts.push({x: cx + (Math.random() - .5) * 40, y: top + 20, vx: (Math.random() - .5) * 60, vy: -40 - Math.random() * 40, g: 0, life: 1.6, max: 1.6, col: i % 2 ? C.hot : C.bile, kind: 'heart'});
  G.mons.forEach(o => { if (o.state !== 'leave') { o.state = 'leave'; o.rise = 0; } });
  Music.mode = 'normal'; Music.tempo = levelTempo();
  sfx.bossWin();

// bosses lumber along and leap from one path to another
function bossMove(m, dt) {
  m.chew -= dt;
  if (m.hop > 0) {
    m.hop = Math.max(0, m.hop - dt);
    const k = 1 - m.hop / .5;
    m.fy = m.fromY + (feetY(m.lane) - m.fromY) * k - Math.sin(k * Math.PI) * 18;
    if (!m.hop) { G.shake = .3; burst(10, m.x + m.w / 2, feetY(m.lane) - 2, '#3a2a30', {vy: -40, spread: 70, g: 200, life: .5}); sfx.thud(); }
    return;
  }
  m.fy = feetY(m.lane);
  if (m.state !== 'walk' || m.x < 70) return;
  if ((m.hopT -= dt) <= 0) {
    const d = m.lane === 0 ? 1 : m.lane === NL - 1 ? -1 : Math.random() < .5 ? -1 : 1;
    m.fromY = m.fy; m.lane += d; m.hop = .5;
    m.hopT = Math.max(1.6, 3 + Math.random() * 3 - m.anger * .5);
  }
}
function loseLife(m) {

  G.lostT = 2.2; G.lostMon = m; setScene('lost'); G.shake = .5;
  addText('OH NON!', PX - 10, laneTop(m.lane) + 2, C.blood, 2);
  sfx.lose();
}
function startCaught(m) {
  G.taken = true; G.caughtT = 0; G.hx = PX + 12; G.candies = []; G.helpSaid = false; G.bossIntro = 0;
  const others = G.mons.filter(o => o !== m && o.state !== 'leave')
    .sort((a, b) => Math.abs(a.lane - G.lane) - Math.abs(b.lane - G.lane) || b.x - a.x).slice(0, 2);
  G.carriers = [m, ...others];
  G.offs = [6, -14, -34];
  G.carriers.forEach(c => { c.fy = feetY(c.lane); c.lane = G.lane; c.state = 'carry'; c.rise = 0; c.dir = 1; });
  setScene('caught'); G.shake = .5;
  musicStop(); sfx.grab(); sfx.gameover();
  addText('ATTRAPÉ!', PX, laneTop(G.lane) - 2, C.blood, 2);
}
function afterLost() {
  G.spawned -= G.mons.filter(m => m.state !== 'leave' && !m.extra).length;

  if (G.boss && !G.bossDone) { G.boss = null; G.bossPending = 1.6; G.bossIntro = 0; }
  G.mons = []; G.candies = []; G.spawnT = 1.4;

let codeBuf = '', cheatOn = false;
// testing shortcut: start straight at level n with 5 lanterns; such runs never enter the records

/* ---------- Update ---------- */
function update(dt) {
  T += dt; sceneT += dt;
  if (scene === 'title' && sceneT > 9) { titlePage = 1 - titlePage; sceneT = 0; }
  if (!G) return;
  G.shake = Math.max(0, G.shake - dt);
  G.py += (feetY(G.lane) - G.py) * Math.min(1, dt * 22);
  for (const p of G.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.life -= dt; p.rot += dt * 8; }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const t of G.texts) { t.y -= 12 * dt; t.life -= dt; }
  G.texts = G.texts.filter(t => t.life > 0);

  if (scene === 'lost') { G.lostT -= dt; if (G.lostT <= 0) afterLost(); return; }
  if (scene === 'caught') {
    const ct = (G.caughtT += dt), fy = feetY(G.lane);
    G.carriers.forEach((m, k) => {
      m.ph += dt * 10;
      const tx = G.hx - 20 + G.offs[k] - m.w / 2;
      if (ct < 1.1) { const a = Math.min(1, dt * 7); m.x += (tx - m.x) * a; m.fy += (fy - m.fy) * a; }
      else { m.x = tx; m.fy = fy; }
      m.dir = ct > 1.4 ? -1 : 1;
    });
    if (ct > 1.4) {
      G.hx -= 105 * dt;
      if (!G.helpSaid) { G.helpSaid = true; addText('AU SECOURS!', G.hx - 20, fy - 80, C.bone, 1.6); }
      if (Math.random() < dt * 14) burst(1, G.hx - 10, fy - 1, '#2a2a3a', {vy: -20, spread: 30, g: 80, life: .5});
    }
    if (G.hx < -80) { G.qualifies = !G.cheat && qualifies(G.score); setScene('over'); }
    return;
  }
  if (scene !== 'play') return;

  G.cool -= dt; G.throwT -= dt; G.bossIntro -= dt;
  if (G.spawned < G.cfg.total) { G.spawnT -= dt; if (G.spawnT <= 0) spawn(); }
  // while the boss is out, smaller monsters keep crawling out to help it
  if (G.boss && !G.bossDone && G.boss.rise <= 0 && (G.minionT -= dt) <= 0) {
    G.minionT = Math.max(3, 6.5 - G.st.cycle);
    if (G.mons.filter(o => !o.boss && o.state !== 'leave').length < 2 + G.st.cycle) spawn(true);
  }

  for (const c of G.candies) {
    c.x -= 260 * dt; c.t += dt;
    let target = null;
    for (const m of G.mons) {
      if (m.lane !== c.lane || m.state === 'leave' || m.hop > .25) continue;
      if (c.x <= m.x + m.w - 4 && c.x >= m.x - 14 && (!target || m.x > target.x)) target = m;
    }
    if (target) { hit(target, c.c); c.dead = true; continue; }
    if (c.x < 30) {
      c.dead = true; G.score = Math.max(0, G.score - 10);
      addText('-10', 48, feetY(c.lane) - 30, C.dim, .8, 'ui');
      burst(6, 22, feetY(c.lane) - 4, CANDIES[c.c].col, {spread: 60, g: 200, life: .4});
      sfx.waste();
    }
  }
  G.candies = G.candies.filter(c => !c.dead);

  for (const m of G.mons) {
    m.ph += dt * (m.boss ? 3.5 + m.mult : 6 + m.mult * 2);
    if (m.rise > 0) { m.rise -= dt; continue; }
    if (m.boss) bossMove(m, dt);
    if (m.state === 'walk') {
      m.x += m.speed * m.mult * (m.chew > 0 ? .35 : 1) * dt;
      if (m.x + m.w >= PATH_X1 - 4) { loseLife(m); return; }
    } else if (m.state === 'react') {
      m.t -= dt;
      if (m.t <= 0) {
        m.state = 'walk'; m.anger++; m.mult = m.boss ? Math.min(m.mult * 1.3, 2.2) : Math.min(m.mult * 1.5, 3.4);
        if (m.sp.id === 'ghost') { m.x += 26; burst(10, m.x + m.w / 2, feetY(m.lane) - 20, C.acid, {spread: 80, g: 0, life: .4}); }
      }
    } else if (m.state === 'meh') {
      m.t -= dt; if (m.t <= 0) m.state = 'walk';
    } else if (m.state === 'leave') {
      m.x -= 95 * dt; if (m.x < -m.w - 10) m.gone = true;
    }
  }
  G.mons = G.mons.filter(m => !m.gone);

  if (G.spawned >= G.cfg.total && G.mons.length === 0) {
    if (!G.cfg.boss || G.bossDone) levelComplete();
    else if (!G.boss) { G.shake = Math.max(G.shake, .15); if ((G.bossPending -= dt) <= 0) spawnBoss(); }
  }
}

    ctx.restore();
    rrect(c.x - 1.4, c.y - 6, 2.8, 6, .6); sh('#d8d2c0', .6);

  ell(x, fy, sp.w * s * .45, 3 * s, 'rgba(0,0,6,.6)', 0, false);
  ctx.save(); ctx.translate(x, fy - Math.abs(Math.sin(T * 2 + k)) * 1.5); ctx.scale(face * s, s);
  sp.draw(Math.sin(T * 1.6 + k) * .7, {seed: k});
  const hd = HEAD[sp.id]; if (hd) rim(hd[0], hd[1], hd[2]);
  ctx.restore();
}
function drawTitle() {
  ctx.fillStyle = 'rgba(2,3,10,.5)'; ctx.fillRect(0, 0, W, H);
  // candies drifting down through the night
  TITLE_CANDIES.forEach(c => {
    const y = ((T * c.sp + c.ph * 40) % 380) - 20, x = c.x + Math.sin(T * .8 + c.ph) * 10;
    ctx.save(); ctx.globalAlpha = .85; drawCandy(c.c, x, y, c.s, T * .8 + c.ph); ctx.restore();
  });
  // the cast
  stageMonster(SPECIES[3], 96, 214 + Math.sin(T * 1.5) * 4, 1.35, 1, 3);
  stageMonster(SPECIES[0], 62, 318, 1.75, 1, 0);
  stageMonster(SPECIES[2], 132, 322, 1.6, 1, 2);
  stageMonster(SPECIES[7], 498, 320, 1.4, -1, 7);
  stageMonster(SPECIES[4], 552, 318, 1.75, -1, 4);
  stageMonster(SPECIES[1], 606, 322, 1.55, -1, 1);
  // candies held up by the front monsters
  drawCandy(0, 100, 268 + Math.sin(T * 3) * 2, 1.8, Math.sin(T * 2) * .3);
  drawCandy(4, 520, 270 + Math.sin(T * 3 + 1) * 2, 1.8, -.6);
  // title
  bigTitle('RAGE DE SUCRE', W / 2, 14, 58);
  txt('Les créatures sortent de l\'ombre. Découvrez quels bonbons elles aiment', W / 2, 78, C.bone, 'center', 12, 'ui', OUT, 500);
  txt('et lesquels elles détestent pour vous en débarrasser.', W / 2, 92, C.bone, 'center', 12, 'ui', OUT, 500);
  // info panel with tabs
  panel(178, 108, 284, 182);
  if (!cheatOn) ['COMMENT JOUER', 'RECORDS'].forEach((t, i) => {
    const tx = i ? W / 2 + 62 : W / 2 - 62, on = titlePage === i;
    txt(t, tx, 120, on ? C.bile : C.mute, 'center', 12, 'ui', null);
    if (on) line(tx - textW(t, 12) / 2, 135, tx + textW(t, 12) / 2, 135, C.blood, 1.4);
  });
  if (cheatOn) {
    rrect(184, 114, 272, 170, 7); ctx.fillStyle = 'rgba(5,9,24,.97)'; ctx.fill();
    txt('RACCOURCI SECRET', W / 2, 120, C.hot, 'center', 18, 'horror');
    txt('Tape un chiffre pour commencer à ce niveau :', W / 2, 144, C.bone, 'center', 12, 'ui', null, 500);
    WORLDS.forEach((wd, i) => {
      const y = 166 + i * 26, b = BOSSES[wd.boss];
      txt((i * 3 + 1) + '  ' + (i * 3 + 2) + '  ' + (i * 3 + 3), 196, y, C.bile, 'left', 15);
      txt(wd.name, 252, y + 1, C.acid, 'left', 12, 'ui', null);
      txt('boss : ' + b.name, 446, y + 1, b.col, 'right', 12, 'ui', null, 500);
    });
    txt('Pas de record en mode raccourci  ·  Échap pour annuler', W / 2, 256, C.dim, 'center', 10, 'ui', null, 500);
  } else if (titlePage === 0) {
    const lines = [
      ['↑ ↓  ou  W S / Z S', 'changer de sentier'],
      ['ESPACE  ou  clic', 'lancer un bonbon'],
      ['1 à 8  ·  Q E  ·  molette', 'choisir le bonbon'],
      ['ÉCHAP', 'grimoire + pause'],
      ['M  /  N', 'musique / sons'],
    ];
    lines.forEach(([k, v], i) => {
      txt(k, 194, 144 + i * 16, C.acid, 'left', 12, 'ui', null);
      txt(v, 446, 144 + i * 16, C.bone, 'right', 12, 'ui', null, 500);
    });
    wrap('Un monstre qui aime son bonbon le dévore et retourne dans sa tombe. S\'il le déteste, il enrage et accélère.', 48)
      .forEach((l, i) => txt(l, W / 2, 230 + i * 13, C.dim, 'center', 11, 'ui', null, 500));
  } else drawBoard(188, 140, 264, null, 7, 14);
  if (!cheatOn) txt('H : changer de page', W / 2, 274, C.mute, 'center', 10, 'ui', null);
  if (blink()) txt('ENTRÉE ou clic pour jouer', W / 2, 300, C.blood, 'center', 20, 'horror');
  drawBar(false);
  txt('Concepteurs : Léo Laganière et Noémi Laganière', W / 2, 341, C.dim, 'center', 11, 'ui', null, 500);
}
function drawIntro() {
  drawHUD();
  panel(120, 46, 400, 276);
  const st = G.st, wd = WORLDS[st.wi];
  titleText('Monde ' + fmtLevel(G.level), W / 2, 54, 30);
  txt(wd.name, W / 2, 86, C.acid, 'center', 16, 'horror');
  let y = 108;
  if (G.bonus) {
    const extra = G.victory ? '   ·   Les 3 mondes sont vaincus!' : G.extraLife ? '   ·   +1 lanterne!' : '';
    txt('Bonus de niveau +' + G.bonus + extra, W / 2, y, C.toxic, 'center', 12, 'ui', null);
    y += 16;
  }
  const newSp = G.newSp.map(i => SPECIES[i]), newC = G.newC;
  if (newSp.length || newC.length) {
    const colX = [W / 2 - 92, W / 2 + 92];
    if (newSp.length) {
      const two = newSp.length > 1, sc = two ? 1.3 : 1.55;
      txt(two ? 'NOUVELLES CRÉATURES' : 'NOUVELLE CRÉATURE', colX[0], y, C.blood, 'center', 12, 'ui', null);
      newSp.forEach((sp, i) => {
        const cx = colX[0] + (two ? (i ? 32 : -32) : 0);
        ctx.save(); ctx.translate(cx, y + 80); ctx.scale(sc, sc); sp.draw(T * 6, {seed: 1 + i}); ctx.restore();
        txt(sp.name, cx, y + 84, sp.col, 'center', two ? 15 : 18, 'horror');
      });
    }
    if (newC.length) {
      txt(newC.length > 1 ? 'BONBONS' : 'NOUVEAU BONBON', colX[1], y, C.blood, 'center', 12, 'ui', null);
      newC.forEach((c, i) => drawCandy(c, colX[1] + (newC.length > 1 ? (i ? 26 : -26) : 0), y + 44, 2.6, Math.sin(T * 2 + i) * .2));
      wrap(newC.map(c => CANDIES[c].name).join(' / '), 26).forEach((l, i) => txt(l, colX[1], y + 78 + i * 14, C.bone, 'center', 13));
    }
    y += 112;
  } else {
    txt(st.cycle ? 'Le cauchemar recommence…' : 'Toutes les créatures sont réunies.', W / 2, y + 18, C.bone, 'center', 14);
    txt('Plus nombreux. Plus rapides.', W / 2, y + 40, C.blood, 'center', 20, 'horror');
    y += 84;
  }
  const hint = G.cfg.boss ? 'Attention! Au bout de ce niveau, un BOSS sort de sa cachette. Il lui faudra plusieurs bonbons…'
    : G.level === 1 ? 'Lance des bonbons et observe : que préfèrent ces créatures?'
    : newSp.length ? 'Que préfère cette créature? Teste, puis vérifie ton grimoire (Échap).'
    : G.cfg.total + ' monstres affamés sortent de leurs cachettes.';
  wrap(hint, 60).forEach((l, i) => txt(l, W / 2, y + i * 14, G.cfg.boss ? C.blood : C.dim, 'center', 12, 'ui', null, G.cfg.boss ? 700 : 500));
  if (blink()) txt('ESPACE ou clic pour commencer', W / 2, 294, C.toxic, 'center', 17, 'horror');
}
function drawGrimoire() {
  ctx.fillStyle = 'rgba(2,3,10,.65)'; ctx.fillRect(0, 0, W, 330);
  panel(36, 20, 568, 306);
  titleText('Grimoire des gourmandises', W / 2, 30, 20);
  const rows = G.spList.map(i => SPECIES[i]), bsp = BOSSES[WORLDS[G.st.wi].boss];
  if (G.boss || G.known[bsp.id]) rows.push(bsp);
  const nc = G.cList.length, ns = rows.length, cx0 = 210, step = Math.min(46, 372 / nc), rowH = Math.min(28, 196 / ns);
  for (let j = 0; j < nc; j++) {
    const x = cx0 + j * step + 10;
    drawCandy(G.cList[j], x, 64, 1.2);
    txt(String(j + 1), x, 74, C.dim, 'center', 9, 'ui', null);
  }
  for (let i = 0; i < ns; i++) {
    const sp = rows[i], y = 92 + i * rowH;
    if (i % 2 === 0) { ctx.fillStyle = 'rgba(46,80,180,.12)'; ctx.fillRect(46, y - 2, 548, rowH); }
    ctx.save(); ctx.beginPath(); ctx.rect(46, y - 2, 40, rowH); ctx.clip();
    const s = (rowH - 2) / sp.h * 1.25;
    ctx.translate(64, y - 2 + rowH + 5 * s); ctx.scale(s, s); sp.draw(0, {seed: i}); ctx.restore();
    txt(sp.name, 92, y + rowH / 2 - 8, sp.col, 'left', 13);
    for (let j = 0; j < nc; j++) {
      const r = G.known[sp.id] && G.known[sp.id][CANDIES[G.cList[j]].id];
      const x = cx0 + j * step + 10, yy = y + rowH / 2 - 2;
      if (r === 'like') heart(x, yy - 4, C.hot, 9);
      else if (r === 'hate') cross(x - 4, yy - 4, C.blood, 8);
      else if (r === 'meh') txt('~', x, yy - 9, C.dim, 'center', 16, 'ui', null);
      else txt('?', x, yy - 8, C.mute, 'center', 13, 'ui', null);
    }
  }
  const ly = 300;
  heart(60, ly - 1, C.hot, 9); txt('aime', 68, ly - 2, C.bone, 'left', 12, 'ui', null, 500);
  cross(110, ly - 1, C.blood, 8); txt('déteste', 122, ly - 2, C.bone, 'left', 12, 'ui', null, 500);
  txt('~  bof', 180, ly - 2, C.bone, 'left', 12, 'ui', null, 500);
  txt('?  à découvrir', 230, ly - 2, C.bone, 'left', 12, 'ui', null, 500);
  button(PAUSE_BTN.resume, 'Reprendre (Échap)', C.toxic);
  button(PAUSE_BTN.quit, 'Terminer la partie (T)', C.blood);
}
function drawOver() {
  ctx.fillStyle = 'rgba(2,3,10,.65)'; ctx.fillRect(0, 0, W, 330);
  panel(140, 62, 360, 236);
  ctx.font = '34px ' + FONT.horror; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.save(); ctx.shadowColor = C.blood; ctx.shadowBlur = 14 * K; ctx.fillStyle = C.blood; ctx.fillText('Le festin', W / 2, 78); ctx.fillText('est terminé', W / 2, 112); ctx.restore();
  txt('Score  ' + pad(G.score, 6) + '      Monde ' + fmtLevel(G.level), W / 2, 154, C.bone, 'center', 14);
  if (G.qualifies) {
    txt('NOUVEAU RECORD! Écris ton nom :', W / 2, 178, C.toxic, 'center', 13);
    rrect(W / 2 - 80, 198, 160, 26, 4); ctx.fillStyle = 'rgba(3,5,12,.9)'; ctx.fill(); ctx.strokeStyle = C.toxic; ctx.lineWidth = 1.2; ctx.stroke();
    if (G.name) txt(G.name + (blink() && G.name.length < 12 ? '_' : ' '), W / 2, 202, C.bile, 'center', 16);
    else txt(blink() ? 'tape ton nom_' : 'tape ton nom', W / 2, 204, C.mute, 'center', 13, 'ui', null, 500);
    txt('ENTRÉE pour enregistrer', W / 2, 238, C.dim, 'center', 12, 'ui', null, 500);
  } else {
    txt('Pas de record cette fois.', W / 2, 190, C.dim, 'center', 13, 'ui', null, 500);
    if (blink()) txt('ENTRÉE ou clic : records', W / 2, 240, C.toxic, 'center', 16, 'horror');
  }
}
function drawBoardScene() {
  ctx.fillStyle = 'rgba(2,3,10,.65)'; ctx.fillRect(0, 0, W, 330);
  panel(130, 24, 380, 300);
  titleText('Records', W / 2, 34, 28);
  drawBoard(150, 72, 340, G && G.run);
  if (blink()) txt('ENTRÉE ou clic pour continuer', W / 2, 296, C.toxic, 'center', 16, 'horror');
}
function render() {
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.clearRect(0, 0, W, H);
  drawWorld();
  if (scene === 'title') drawTitle();
  else if (scene === 'intro') drawIntro();
  else {
    drawHUD();
    drawBossUI();
    if (scene === 'pause') drawGrimoire();
    if (scene === 'over') drawOver();
    if (scene === 'board') drawBoardScene();
  }
}

/* ---------- Loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
  try {
    if (cv.width < 2 || cv.height < 2) fit();
    update(dt); render();
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}

/* ---------- Input ---------- */
function proceed() {
  initAudio();
  if (scene === 'title') newGame();
  else if (scene === 'intro') beginLevel();
  else if (scene === 'pause') setScene('play');
  else if (scene === 'over') { if (G.qualifies) submitName(); else goBoard(); }
  else if (scene === 'board') { G = null; setTheme(0); setScene('title'); titlePage = 1; }
}
function moveLane(d) { G.lane = Math.max(0, Math.min(NL - 1, G.lane + d)); }
function selectCandy(i) {
  if (!G || i < 0 || i >= G.cList.length || i === G.sel) return;
  G.sel = i; sfx.select();
}
window.addEventListener('keydown', e => {
  const k = e.key;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab', 'Backspace'].includes(k)) e.preventDefault();
  initAudio();
  if (scene === 'over' && G.qualifies) {
    if (k === 'Enter' && !e.repeat) { if (sceneT > .6) submitName(); }
    else if (k === 'Backspace') { G.name = G.name.slice(0, -1); sfx.type(); }
    else if (k.length === 1 && /[\p{L}\p{N} .!\-_]/u.test(k) && G.name.length < 12) { G.name += k.toUpperCase(); sfx.type(); }
    return;
  }
  if (k === 'm' || k === 'M') { toggleMusic(); return; }
  if (k === 'n' || k === 'N') { toggleSfx(); return; }
  // secret shortcut: type SUCRE on the home screen, then a digit to start at that level
  if (scene === 'title') {
    if (/^[a-z]$/i.test(k)) {
      codeBuf = (codeBuf + k.toUpperCase()).slice(-5);
      if (codeBuf === 'SUCRE' && !cheatOn) { cheatOn = true; sfx.level(); return; }
    }
    if (cheatOn && /^[1-9]$/.test(k)) { startAt(+k); return; }
    if (cheatOn && k === 'Escape') { cheatOn = false; codeBuf = ''; return; }
  }
  if (scene === 'play') {
    if (k === 'ArrowUp' || k === 'w' || k === 'W' || k === 'z' || k === 'Z') moveLane(-1);
    else if (k === 'ArrowDown' || k === 's' || k === 'S') moveLane(1);
    else if (k === ' ' || k === 'ArrowLeft') throwCandy();
    else if (/^[1-8]$/.test(k)) selectCandy(+k - 1);
    else if (k === 'q' || k === 'Q' || k === 'a' || k === 'A') selectCandy((G.sel - 1 + G.cList.length) % G.cList.length);
    else if (k === 'e' || k === 'E' || k === 'Tab') selectCandy((G.sel + 1) % G.cList.length);
    else if (k === 'Escape' || k === 'p' || k === 'P') setScene('pause');
  } else if (scene === 'pause') {
    if (k === 'Escape' || k === 'p' || k === 'P' || k === 'Enter' || k === ' ') setScene('play');
    else if (k === 't' || k === 'T') quitToHome();
  } else if (scene === 'title' && (k === 'h' || k === 'H' || k === 'ArrowLeft' || k === 'ArrowRight' || k === 'Tab')) {
    titlePage = 1 - titlePage; sceneT = 0;
  } else if ((k === 'Enter' || k === ' ') && !e.repeat && sceneT > .6) proceed();
});
function toCanvas(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
}
cv.addEventListener('pointerdown', e => {
  cv.focus();
  const [x, y] = toCanvas(e);
  initAudio();
  if (y >= 332) {
    if (x >= BTN.music && x < BTN.music + 30) { toggleMusic(); return; }
    if (x >= BTN.sfx && x < BTN.sfx + 30) { toggleSfx(); return; }
    if (scene === 'play') {
      if (x >= BTN.book && x < BTN.book + 30) { setScene('pause'); return; }
      const i = Math.floor((x - 8) / 30);
      if (x >= 8 && i < G.cList.length) selectCandy(i);
    }
    return;
  }
  if (scene === 'play') {
    if (y >= LT && y < LT + NL * LH) {
      G.lane = Math.max(0, Math.min(NL - 1, Math.floor((y - LT) / LH)));
      throwCandy();
    }
    return;
  }
  if (scene === 'pause') {
    if (inBox(PAUSE_BTN.resume, x, y)) setScene('play');
    else if (inBox(PAUSE_BTN.quit, x, y)) quitToHome();
    return;
  }
  if (scene === 'title' && y >= 118 && y <= 138 && x > 180 && x < 460) { titlePage = x < W / 2 ? 0 : 1; sceneT = 0; return; }
  if (scene === 'lost' || scene === 'caught') return;
  if (sceneT > .6) proceed();
});
cv.addEventListener('pointermove', e => { [MX, MY] = toCanvas(e); cv.style.cursor = scene === 'pause' && !inBox(PAUSE_BTN.resume) && !inBox(PAUSE_BTN.quit) && MY < 330 ? 'default' : 'pointer'; });
cv.addEventListener('pointerleave', () => { MX = MY = -1; });
cv.addEventListener('wheel', e => {
  if (scene !== 'play') return;
  e.preventDefault();
  const n = G.cList.length;
  selectCandy((G.sel + (e.deltaY > 0 ? 1 : -1) + n) % n);
}, {passive: false});
window.addEventListener('blur', () => { if (scene === 'play') setScene('pause'); });

/* ---------- Responsive fit: render at the screen's real resolution ---------- */
let fitTimer = null;
function fit() {
  const vw = window.innerWidth || document.documentElement.clientWidth || W;
  const vh = window.innerHeight || document.documentElement.clientHeight || H;
  const s = Math.max(.2, Math.min(vw / W, vh / H));
  const cssW = Math.max(64, Math.floor(W * s)), cssH = Math.max(36, Math.floor(H * s));
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.style.width = cssW + 'px'; cv.style.height = cssH + 'px';
  cv.width = Math.round(cssW * dpr); cv.height = Math.round(cssH * dpr);
  K = cv.width / W;
  buildScenery();
}
const refit = () => { clearTimeout(fitTimer); fitTimer = setTimeout(fit, 120); };
window.addEventListener('resize', refit);
if (window.ResizeObserver) new ResizeObserver(refit).observe(document.documentElement);

let started = false;
const start = () => { if (started) return; started = true; fit(); try { cv.focus({preventScroll: true}); } catch (e) {} requestAnimationFrame(t => { last = t; frame(t); }); };
const fontsReady = document.fonts && document.fonts.load
  ? Promise.all([document.fonts.load('16px "Creepster"'), document.fonts.load('700 12px "Barlow Condensed"'), document.fonts.load('500 12px "Barlow Condensed"')]).catch(() => {})
  : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 2500))]).then(start, start);
})();
</script>
